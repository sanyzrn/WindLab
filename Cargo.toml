[package]
name = "windlab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "WindLab phase-1 HTTPS proxy connectivity proof. Fixture-verified; makes no OS network changes."

[lib]
name = "windlab"
path = "src/lib.rs"

[[bin]]
name = "windlab-proof"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
httparse = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url = "2"
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "signal"] }

[profile.release]
lto = "thin"
strip = "symbols"